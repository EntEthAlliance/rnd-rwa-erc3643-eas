name: PR policy

# Deterministic tier-1 check from ENGINEERING_QUALITY.md: the PR must state its
# final intended change in reviewable form before any other tier is worth running.
#
# This workflow is intentionally read-only and takes no repository secrets.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Supersede obsolete runs for the same PR, but never for the same commit twice.
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: PR contract
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write PR body to file
        # Via env, not inline interpolation, so a PR body cannot inject shell.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr_body.md

      - name: Check PR contract
        run: python3 .github/scripts/check_pr_contract.py --body-file /tmp/pr_body.md

  ci-result:
    name: CI result
    # Stable aggregate result for branch protection, so intentional
    # path-specific skips never masquerade as missing checks.
    runs-on: ubuntu-latest
    needs: [contract]
    if: always()
    steps:
      - name: Aggregate
        run: |
          if [ "${{ needs.contract.result }}" != "success" ]; then
            echo "PR contract did not pass: ${{ needs.contract.result }}"
            exit 1
          fi
          echo "All required checks passed."
